name: CI

# The fast gate (docs/design/20261020-i002-github-actions.md): every push to
# main and every pull request configures the library, builds it with its
# tools, and runs the unit tests (the probes, through CTest, and the
# recompilation helpers' Python tests). rexbox holds no
# game data, so this is the whole library.
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on a task branch (gh workflow run ci.yml --ref <branch>) to
  # check a CI change before any pull request exists.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win32:
    name: Win32 x86 build and tests
    # Pinned rather than windows-latest: build_win32_x86.ps1 picks its
    # generator from the installed Visual Studio, so a floating image would
    # silently change the toolchain.
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # SDL, imgui, smaa and XbSymbolDatabase are built from source.
          submodules: true

      - name: Build
        shell: powershell
        run: .\scripts\build_win32_x86.ps1 -Configuration ${{ matrix.configuration }}

      - name: Unit tests (CTest)
        shell: powershell
        run: ctest --test-dir build\win32_x86 -C ${{ matrix.configuration }} --output-on-failure

      - name: Recompilation helper tests (Python)
        shell: powershell
        run: python -m unittest discover -s scripts/recomp -p "test_*.py"

  linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.configuration }} build and tests
    # Pinned like the Windows image. x86 is a -m32 build on the multilib
    # toolchain with the i386 development libraries SDL3 compiles against
    # (docs/design/20261020-i004-linux-preparation.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [x64, x86]
        configuration: [debug, release]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install the toolchain and SDL3's development libraries
        run: |
          set -e
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          packages="ninja-build libasound2-dev libpulse-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl-dev libegl-dev"
          if [ "${{ matrix.arch }}" = "x86" ]; then
            i386=""
            for p in libasound2-dev libpulse-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl-dev libegl-dev; do
              i386="$i386 $p:i386"
            done
            sudo apt-get install -y gcc-multilib g++-multilib ninja-build $i386
          else
            sudo apt-get install -y $packages
          fi

      - name: Build and test
        # Through bash: the checkout may not carry the execute bit.
        run: bash scripts/build_linux.sh ${{ matrix.arch }} ${{ matrix.configuration }}
